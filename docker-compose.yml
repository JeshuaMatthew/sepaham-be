# Postgres + LiveKit untuk pengembangan lokal. Start with: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: sepaham-db
    environment:
      POSTGRES_USER: sepaham
      POSTGRES_PASSWORD: sepaham
      POSTGRES_DB: sepaham
    ports:
      - "5432:5432"
    volumes:
      - sepaham_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sepaham -d sepaham"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SFU media server untuk panggilan grup (mic + video). Backend hanya mencetak
  # access token; media mengalir langsung antara klien dan LiveKit.
  livekit:
    image: livekit/livekit-server:latest
    container_name: sepaham-livekit
    command: ["--config", "/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
    ports:
      - "7880:7880"       # HTTP + signaling (WebSocket)
      - "7881:7881"       # RTC over TCP
      - "7882:7882/udp"   # RTC over UDP

volumes:
  sepaham_pgdata:
