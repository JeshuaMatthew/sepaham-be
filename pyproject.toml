[project]
name = "app"
version = "0.1.0"
description = "Rest API Backend for Sepaham Project"
readme = "README.md"
authors = [
    { name = "JeshuaMatthew", email = "2381009@unai.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "alembic-postgresql-enum>=1.10.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "openai>=3.19.2",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
